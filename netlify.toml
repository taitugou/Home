# Netlify 静态部署配置
[build]
  publish = "."

# 重定向规则 - SPA 支持（可选，如果需要）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# 缓存控制 - 静态资源长期缓存
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/f.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
